<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>El Tío Viruelas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Rock+Salt&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:,">
</head>
<body>

<main class="escenario">

  <!-- ================= HEADER ================= -->
  <header>
    <img src="img/logo.jpeg" class="logo" draggable="false">
    <h1>El Tío Viruelas</h1>
  </header>

  <!-- ================= TOCADISCOS ================= -->
  <div class="tocadiscos">

    <!-- Brazo -->
    <img src="img/tocadiscos/brazo1.png" id="brazo" class="brazo" draggable="false">

    <!-- Vinilo -->
    <div class="vinilo-wrapper lento" id="viniloWrapper">
      <div class="vinilo" id="vinilo">
        <img src="img/logo.jpeg" id="galleta" class="galleta" draggable="false">
        <div class="agujero"></div>
      </div>
    </div>

    <!-- ================= CONTROLES ================= -->
    <div class="controles">
      <button id="playpause" class="ctrl">▶</button>

      <div class="potenciometro" id="potenciometro">
        <div class="marca"></div>
        <span class="min">MIN</span>
        <span class="max">MAX</span>
      </div>
    </div>

  </div>

  <!-- ================= VOLUMENES ================= -->
  <div id="volumenes-container" class="volumenes-scroll"></div>

  <!-- ================= VU METER ================= -->
  <div class="vu-meter">
    <div class="vu-caja">
      <img src="img/vu/vu.png" class="vu-img" draggable="false">
      <div class="aguja" id="aguja"></div>
    </div>
  </div>

  <!-- ================= PORTADAS ================= -->
  <div class="portadas" id="portadas"></div>

  <!-- AUDIO PRINCIPAL -->
  <audio id="audio" preload="auto"></audio>

  <!-- AUDIO AGUJA (desactivado) -->
  <!-- <audio id="needle" src="audio/needle.mp3" preload="auto"></audio> -->

  <!-- ================= LETRA Y EXTRA ================= -->
  <div class="letra"><pre id="letra-texto"></pre></div>
  <div class="extra"><pre id="extra-texto"></pre></div>

</main>

<script src="app.js"></script>

 <footer style="margin-top: 40px; padding: 20px; background: #111; color: #C88713; text-align: center;">
  <h2 style="font-family: 'Rock Salt', cursive; margin-bottom: 15px;">Contacto</h2>
  <form id="contact-footer" class="footer-form" style="max-width: 500px; margin: auto;">
    <input 
      type="email" 
      name="user_email" 
      placeholder="Tu correo electrónico" 
      required
      style="width: 100%; padding: 10px; margin-bottom: 10px; border: 2px solid #C88713; background: #000; color: #C88713; font-family: 'Rock Salt', cursive;"
    />
    <textarea 
      name="message" 
      placeholder="Escribe tu mensaje..." 
      required
      style="width: 100%; padding: 10px; height: 100px; margin-bottom: 10px; border: 2px solid #C88713; background: #000; color: #C88713; font-family: 'Rock Salt', cursive;"
    ></textarea>
    <button 
      type="submit" 
      style="padding: 10px 20px; border: 2px solid #C88713; background: #111; color: #C88713; font-family: 'Rock Salt', cursive; cursor: pointer;"
    >
      Enviar
    </button>
  </form>
</footer>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
  (function() {
    emailjs.init("xEdXF-K2sCKhWx4ZG");
  })();

  document.getElementById("contact-footer").addEventListener("submit", function(e) {
    e.preventDefault();

    const form = this;
    const email = form.querySelector("[name='user_email']").value;
    const message = form.querySelector("[name='message']").value;

emailjs.send("service_56aasda", "template_oi3yf6s", {
  message: `Email del usuario: ${email}\n\nMensaje:\n${message}`
})

    .then(() => {
      alert("Mensaje enviado correctamente");
      form.reset();
    })
    .catch(() => {
      alert("Hubo un error al enviar el mensaje :(");
    });
  });
</script>




  
</body>

</html>
